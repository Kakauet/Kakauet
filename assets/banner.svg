<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Kakauet · Guillem Ballester">
<title>Kakauet · Guillem Ballester</title>
<style>text{font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif}</style>
<defs><filter id="wobble" x="-5%" y="-30%" width="110%" height="160%">
  <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="paper" x="-3%" y="-5%" width="106%" height="114%">
  <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="8" result="e"/>
  <feDisplacementMap in="SourceGraphic" in2="e" scale="9" xChannelSelector="R" yChannelSelector="G" result="sheet"/>
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="1" result="g"/>
  <feColorMatrix in="g" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.30  0.32 0 0 0 -0.1" result="gc"/>
  <feComposite in="gc" in2="sheet" operator="in" result="grain"/>
  <feDropShadow in="sheet" dx="0" dy="4" stdDeviation="7" flood-color="#0b1020" flood-opacity=".28" result="lifted"/>
  <feMerge><feMergeNode in="lifted"/><feMergeNode in="grain"/></feMerge>
</filter>
<filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
  <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" seed="9" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/>
  <feGaussianBlur stdDeviation="1.2"/>
</filter>
<radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
  <stop offset="0" stop-color="#d9662b" stop-opacity=".55"/><stop offset=".55" stop-color="#8f2a1a" stop-opacity=".3"/><stop offset="1" stop-color="#5a1510" stop-opacity="0"/>
</radialGradient>
</defs>

<rect x="24" y="22" width="1152" height="276" rx="4" fill="#f3eee3" filter="url(#paper)"/>
<g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#wobble)"><path d="M500 276 C380 258 222 288 120 270 C50 256 44 120 82 78 C150 26 330 44 470 38 C560 32 612 48 684 56 C728 62 740 104 700 106 C660 108 664 66 712 50 C800 22 960 44 1060 74 C1110 90 1160 112 1230 106" stroke="#9e1b26" stroke-width="4.2"/></g>
<g stroke="#9e1b26" stroke-width="1.3" fill="none" stroke-linecap="round" opacity=".8"><path d="M500 276 C508 272 514 266 518 260"/><path d="M500 276 C510 276 518 276 524 278"/><path d="M500 276 C508 280 514 286 516 292"/></g>
<text x="108" y="180" font-size="112" font-weight="800" letter-spacing="-3" fill="#161c28">Kakauet</text>
<text x="114" y="232" font-size="32" font-weight="600" fill="#9e1b26">Guillem Ballester</text>

</svg>
